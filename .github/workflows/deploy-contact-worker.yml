name: Deploy contact Worker

on:
  push:
    branches: [main]
    # Only what goes into the deployed Worker: its source and config, and the shared source it imports.
    paths:
      - workers/contact-worker/src/**
      - workers/contact-worker/wrangler.jsonc
      - shared/src/**
  workflow_dispatch: {}

permissions:
  contents: read

# Deploys never overlap or cancel one another half-way.
concurrency:
  group: contact-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Check and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @personal-site/shared --filter @personal-site/contact-worker run checks

      # The Worker's own secrets (TURNSTILE_SECRET, CONTACT_TO_ADDRESS) are set once with `wrangler secret put` and
      # survive a deploy; only the Cloudflare credentials below live in GitHub.
      - run: pnpm run deploy
        working-directory: workers/contact-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
