name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    concurrency:
      group: ci-cd-${{ github.ref }}
      cancel-in-progress: true
    steps:
      # The whole history, because the sitemap dates each page by the last commit that changed it
      # (`webapp/src/site/sitemap/`); a one-commit checkout would date every page the same day.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: webapp/dist/

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # GitHub's Pages sync is sometimes slow. The default 10 minutes cancelled a deployment that was still working,
          # and a cancelled deployment cannot be redeployed for the same commit (its ID is the commit SHA).
          timeout: 1200000

  notify-index-now:
    name: Notify IndexNow
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: node --import ./src/scripts/register-src-alias/RegisterSrcAlias.ts src/scripts/submit-index-now/SubmitIndexNow.ts
        working-directory: webapp
